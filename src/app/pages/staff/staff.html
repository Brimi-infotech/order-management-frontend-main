<section class="section">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title">Staff List</h5>

            <button class="btn btn-primary" (click)="addStaff()">Add New Staff</button>
          </div>

          <table class="table datatable">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Username</th>
                <th scope="col">User Code</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              @for (staff of staffs(); track $index) {
              <tr>
                <th scope="row">{{ $index + 1 }}</th>
                <td>{{ staff.name }}</td>
                <td>{{ staff.username }}</td>
                <td>{{ staff.userCode }}</td>
                <td>
                  <button class="btn btn-sm btn-primary me-2" (click)="editStaff(staff._id)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-danger" (click)="deleteStaff(staff._id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
              }@empty {
              <tr>
                <td colspan="5" class="text-center">No staff found.</td>
              </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
