<section class="section">
	<div class="row">
		<div class="col-lg-12">
			<div class="card">
				<div class="card-body">
					<div class="d-flex justify-content-between align-items-center">
						<h5 class="card-title">Items List</h5>
						<button class="btn btn-primary" (click)="addItem()">Add New Item</button>
					</div>
					<table class="table datatable">
						<thead>
							<tr>
								<th scope="col">#</th>
								<th scope="col">Item Code</th>
								<th scope="col">Name</th>
								<th scope="col">Actions</th>
							</tr>
						</thead>
						<tbody>
							@for (item of items(); track $index) {
							<tr>
								<th scope="row">{{ $index + 1 }}</th>
								<td>{{ item.itemcode }}</td>
								<td>{{ item.name }}</td>
								<td>
									<button class="btn btn-sm btn-primary me-2" (click)="editItem(item._id)">
										<i class="bi bi-pencil"></i>
									</button>
									<button class="btn btn-sm btn-danger" (click)="deleteItem(item._id)">
										<i class="bi bi-trash"></i>
									</button>
								</td>
							</tr>
							}@empty {
							<tr>
								<td colspan="5" class="text-center">No items found.</td>
							</tr>
							}
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</section>
